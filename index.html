<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blooom — flowers for the teachers who changed your year</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#F6F9F5;--card:#fff;--ink:#17352D;--mut:#5C7068;--line:#DCE6DF;--pink:#E8467C;--pink2:#C9336A;--sun:#F6C945;--lilac:#E6DDF8;--chalk:#17352D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1C18;--card:#18292A;--ink:#EAF3EE;--mut:#9DB3AA;--line:#2A4039;--lilac:#2B2745;--chalk:#0B1512}}
:root[data-theme="dark"]{--bg:#0F1C18;--card:#18292A;--ink:#EAF3EE;--mut:#9DB3AA;--line:#2A4039;--lilac:#2B2745;--chalk:#0B1512}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.1;margin:0}
a{color:inherit}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar{max-width:1080px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.logo{font:800 22px 'Bricolage Grotesque',sans-serif;text-decoration:none;display:flex;align-items:center;gap:8px;margin-right:auto}
nav{display:flex;gap:4px}nav a{padding:8px 12px;border-radius:99px;text-decoration:none;font-weight:500}
nav a:hover,nav a.on{background:var(--lilac)}
.btn{border:0;border-radius:99px;padding:12px 22px;font-weight:700;background:var(--pink);color:#fff;text-decoration:none;display:inline-block}
.btn:hover{background:var(--pink2)}.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn.alt:hover{background:var(--lilac)}.btn.sm{padding:8px 16px}.btn.big{padding:16px 30px;font-size:18px}
.acct{position:relative}
.acctbtn{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px 5px 5px;color:var(--ink)}
.dot{width:30px;height:30px;border-radius:50%;background:var(--sun);color:#17352D;display:grid;place-items:center;font-weight:800}
.menu{position:absolute;right:0;top:48px;width:290px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.18);display:none}
.menu.open{display:block}
.bal{font:800 34px 'Bricolage Grotesque';margin:2px 0 10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.mi{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 6px;border-top:1px solid var(--line);color:var(--ink)}
.mi:hover{color:var(--pink)}
main{max-width:1080px;margin:auto;padding:0 16px 80px}
.hero{background:var(--chalk);color:#F2F7F3;border-radius:28px;margin-top:20px;padding:48px 36px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center;overflow:hidden}
.hero h1{font-size:clamp(36px,6vw,64px);font-weight:800}
.hero p{font-size:19px;color:#C9DAD0;max-width:46ch}
.hero .btn.alt{color:#fff;border-color:#fff}.hero .btn.alt:hover{background:rgba(255,255,255,.12)}
.feat{background:var(--card);color:var(--ink);border-radius:22px;overflow:hidden;transform:rotate(2deg);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700[...]
.pic{aspect-ratio:4/3;width:100%;display:block;object-fit:cover;background:var(--lilac)}
.pad{padding:16px 18px 18px}
.sec{margin-top:56px}.sec h2{font-size:clamp(26px,4vw,38px);margin-bottom:18px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;counter-reset:s}
.step{background:var(--lilac);border-radius:20px;padding:22px}.step b{font:800 20px 'Bricolage Grotesque'}
.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:800;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.card h3{font-size:22px;margin:6px 0}.card p{margin:0 0 12px;color:var(--mut)}
.prog{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--sun))}
.small{font-size:14px;color:var(--mut)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:24px}
label{display:block;font-weight:700;margin:14px 0 6px}
input,textarea,select{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:130px;resize:vertical}
.amts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.amt{padding:14px 0;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-weight:800;font-size:18px}
.amt.on{border-color:var(--pink);background:var(--pink);color:#fff}
.drop{border:2px dashed var(--mut);border-radius:18px;padding:22px;text-align:center;background:var(--bg)}
.drop img{max-width:100%;max-height:220px;border-radius:12px}
.back{display:inline-block;margin:22px 0 0;color:var(--mut)}
dialog{border:0;border-radius:24px;padding:26px;width:min(560px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,20,16,.55)}
.tx{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.pos{color:#1E8E5A;font-weight:700}.neg{font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;display:none;z-index:50;max-width:92vw}
footer{text-align:center;color:var(--mut);font-size:14px;padding:30px 16px}
@media (max-width:760px){.hero,.two,.steps{grid-template-columns:1fr}.hero{padding:30px 22px}.feat{transform:none}nav{display:none}.bnav{display:flex}.bar{padding:8px 12px}}
.bnav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));z-index:19}
.bnav a{text-decoration:none;font-weight:700;font-size:13px;padding:6px 10px;border-radius:12px}.bnav a.on{background:var(--lilac)}
@media (max-width:760px){main{padding-bottom:110px}}
@media (prefers-reduced-motion:no-preference){.feat{animation:pop .7s ease-out both}@keyframes pop{from{transform:rotate(8deg) translateY(30px);opacity:0}}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#/">🌷 Blooom</a>
  <nav id="nav"><a href="#/" data-r="home">Home</a><a href="#/teachers" data-r="teachers">Teachers</a><a href="#/add" data-r="add">Nominate a teacher</a></nav>
  <div class="acct">
    <button class="acctbtn" id="ab" aria-haspopup="true" aria-expanded="false"><span class="dot" id="ini">A</span><b id="abal">$25.00</b></button>
    <div class="menu" id="menu">
      <div class="small">Your balance</div><div class="bal" id="mbal">$25.00</div>
      <div class="row"><button class="btn sm" data-a="fund">Add funds</button><button class="btn sm alt" data-a="out">Withdraw</button></div>
      <div style="height:10px"></div>
      <button class="mi" data-a="hist">Transaction history</button>
      <button class="mi" data-a="set">Account settings</button>
    </div>
  </div>
</div></header>
<main id="app"></main>
<div class="bnav" id="bnav"><a href="#/" data-r="home">Home</a><a href="#/teachers" data-r="teachers">Donate</a><a href="#/add" data-r="add">Nominate</a></div>
<dialog id="dlg"></dialog><div class="toast" id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Number(n).toFixed(2);
const S={bal:25,user:{name:'Alex Student',email:'alex@school.edu',anon:false},tx:[{t:'Welcome credit',a:25,d:'Today'}],
 teachers:[
  {id:1,name:'Ms. Rivera',role:'8th grade English',by:'Dana, 8th grader',goal:60,raised:38,text:"She stayed after school every Thursday to help me with my essays, and she never once made me feel behind. I went from dreading writing to actually liking it. She's always buying supplies with her own money, so I'd love to give her something back.",av:{bg:'#F6C945',skin:'#B9774F',hair:'#2A1A14',top:'#7B5EA7',style:'bun',glasses:1}},
  {id:2,name:'Mr. Okafor',role:'Chemistry',by:'Priya, junior',goal:80,raised:71,text:"He turned lab days into the best part of my week and explained moles four different ways until it clicked. He also coaches the robotics club for free.",av:{bg:'#BFE3D0',skin:'#7A4B32',hair:'#14100E',top:'#2F6F8F',style:'short',glasses:0}},
  {id:3,name:'Mrs. Lindqvist',role:'2nd grade',by:'You',mine:1,goal:50,raised:12,text:"She taught my little brother to read and calls every parent with good news, not just bad. Our class wants to surprise her on the last day of school.",av:{bg:'#F7C6D6',skin:'#F0C9A8',hair:'#B8B1A8',top:'#E8467C',style:'bob',glasses:1}}
 ]};
function avatar(a){const hair=a.hair,sk=a.skin;
 const back=a.style==='bob'?`<path d="M96 120c-6 50 4 80 26 86h76c22-6 32-36 26-86-6-44-30-62-64-62s-58 18-64 62z" fill="${hair}"/>`:a.style==='bun'?`<circle cx="160" cy="46" r="30" fill="${hair}"/>`:'';
 const front=a.style==='short'?`<path d="M112 112c0-34 20-52 48-52s48 18 48 52c-10-16-24-24-48-24s-38 8-48 24z" fill="${hair}"/>`:`<path d="M110 118c2-36 24-54 50-54s48 18 50 54c-14-18-28-26-50-26s-36 8-50 26z" fill="${hair}"/>`;
 return `<svg class="pic" viewBox="0 0 320 240" role="img" aria-label="Illustrated portrait of ${esc(a.n||'a teacher')}" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="240" fill="${a.bg}"/><rect x="18" y="26" width="64" height="150" rx="6" fill="#0002"/><g fill="#fff6"><rect x="26" y="36" width="48" height="8"/><rect x="26" y="76" width="48" height="8"/><rect x="26" y="116" width="48" height="8"/></g><rect x="232" y="30" width="70" height="46" rx="4" fill="#17352D"/><path d="M240 44h40M240 56h24" stroke="#fff9" stroke-width="3" stroke-linecap="round"/>${back}<path d="M70 240c4-44 40-60 90-60s86 16 90 60z" fill="${a.top}"/><path d="M140 182l20 28 20-28z" fill="#fff"/><rect x="146" y="150" width="28" height="36" rx="10" fill="${sk}"/><ellipse cx="160" cy="120" rx="46" ry="54" fill="${sk}"/><ellipse cx="114" cy="124" rx="7" ry="11" fill="${sk}"/><ellipse cx="206" cy="124" rx="7" ry="11" fill="${sk}"/>${front}<g fill="#2b1b14"><ellipse cx="142" cy="122" rx="5" ry="6"/><ellipse cx="178" cy="122" rx="5" ry="6"/></g><g fill="#fff"><circle cx="144" cy="120" r="1.8"/><circle cx="180" cy="120" r="1.8"/></g><path d="M130 108q12-7 24-1M166 107q12-6 24 1" stroke="${hair}" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M160 126q-5 14 3 17" stroke="#0003" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M142 150q18 14 36 0" stroke="#8a2f2f" stroke-width="5" fill="none" stroke-linecap="round"/>${a.glasses?`<g fill="none" stroke="#2b2b2b" stroke-width="3"><rect x="125" y="110" width="34" height="26" rx="10"/><rect x="161" y="110" width="34" height="26" rx="10"/><path d="M159 122h2"/></g>`:''}<g transform="translate(236 160)"><g fill="#E8467C"><circle cx="0" cy="0" r="9"/><circle cx="16" cy="6" r="9" fill="#F6C945"/><circle cx="-14" cy="8" r="9" fill="#fff"/></g><path d="M0 10l-6 40M16 16l4 34M-14 18l8 32" stroke="#2F8F5B" stroke-width="3"/></g></svg>`}
function pic(t){return t.img?`<img class="pic" src="${t.img}" alt="Photo of ${esc(t.name)}">`:avatar({...t.av,n:t.name})}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function sync(){const b=money(S.bal);$('#abal').textContent=b;$('#mbal').textContent=b;$('#ini').textContent=(S.user.name.trim()[0]||'A').toUpperCase()}
function card(t){const p=Math.min(100,t.raised/t.goal*100);return `<article class="card">${pic(t)}<div class="pad"><span class="tag">${esc(t.role)}</span><h3>${esc(t.name)}</h3><p>${esc(t.text.length>120?t.text.slice(0,120)+'…':t.text)}</p><div class="prog"><i style="width:${p}%"></i></div><div class="small"><b>${money(t.raised)}</b> of ${money(t.goal)} for flowers</div><div class="row" style="margin-top:14px"><a class="btn sm" href="#/donate/${t.id}">Donate</a><a class="btn sm alt" href="#/donate/${t.id}">Read story</a></div></div></article>`}
const views={
home(){const t=S.teachers[0];return `<section class="hero"><div><h1>Say thanks with flowers.</h1><p>Tell us about the teacher who made your year better. Friends and family chip in, and you buy them a bouquet they won't forget.</p><div class="row" style="margin-top:22px"><a class="btn big" href="#/teachers">Donate to a teacher</a><a class="btn alt big" href="#/add">Nominate yours</a></div></div>
 <div class="feat"><div style="position:relative">${pic(t)}<span class="tag" style="position:absolute;left:12px;top:12px">AI-made example</span></div><div class="pad"><h3 style="font-size:24px">${esc(t.name)}, ${esc(t.role)}</h3><p class="small" style="margin:6px 0 10px">${esc(t.text.slice(0,110))}…</p><div class="prog"><i style="width:${t.raised/t.goal*100}%"></i></div><div class="small">${money(t.raised)} of ${money(t.goal)}</div><a class="btn sm" style="margin-top:12px" href="#/donate/${t.id}">Donate $10</a></div></div></section>
 <section class="sec"><h2>How it works</h2><div class="steps"><div class="step"><b>Nominate</b><p>Add a photo and a few sentences on why your teacher deserves flowers.</p></div><div class="step"><b>Chip in</b><p>Anyone can donate in a few taps, from $5 up.</p></div><div class="step"><b>Send flowers</b><p>The money goes to your balance so you can buy the bouquet.</p></div></div></section>
 <section class="sec"><h2>Teachers waiting for flowers</h2><div class="grid">${S.teachers.map(card).join('')}</div></section>`},
teachers(){return `<section class="sec"><h2>Pick a teacher to celebrate</h2><div class="grid">${S.teachers.map(card).join('')}</div><p style="margin-top:28px"><a class="btn alt" href="#/add">Don't see yours? Nominate a teacher</a></p></section>`},
donate(id){const t=S.teachers.find(x=>x.id==id);if(!t)return views.teachers();const p=Math.min(100,t.raised/t.goal*100);
 return `<a class="back" href="#/teachers">← All teachers</a><div class="two"><div class="panel" style="padding:0;overflow:hidden">${pic(t)}<div class="pad"><span class="tag">${esc(t.role)}</span><h2 style="font-size:32px;margin:8px 0">${esc(t.name)}</h2><p>${esc(t.text)}</p><div class="small">Nominated by ${esc(t.by)}</div></div></div>
 <div class="panel"><div class="small">Raised so far</div><div class="bal">${money(t.raised)} <span class="small">of ${money(t.goal)}</span></div><div class="prog"><i style="width:${p}%"></i></div>
 <label>Choose an amount</label><div class="amts" id="amts">${[5,10,25,50].map((a,i)=>`<button class="amt${i==1?' on':''}" data-v="${a}">$${a}</button>`).join('')}</div>
 <label for="cust">Or type your own</label><input id="cust" type="number" min="1" step="1" placeholder="Other amount">
 <label for="pay">Pay with</label><select id="pay"><option value="bal">My balance (${money(S.bal)})</option><option value="card">Card (demo)</option></select>
 <label for="msg">Leave a note (optional)</label><input id="msg" maxlength="120" placeholder="Thank you for everything!">
 <button class="btn big" style="width:100%;margin-top:20px" id="go" data-id="${t.id}">Donate $10</button></div></div>`},
add(){return `<section class="sec" style="max-width:640px;margin-inline:auto"><h2>Nominate a teacher</h2><div class="panel"><label for="tn">Teacher's name</label><input id="tn" placeholder="Ms. Rivera"><label for="tr">Subject or grade</label><input id="tr" placeholder="8th grade English">
 <label>Photo</label><div class="drop" id="drop"><div id="prev">Pick a clear photo of your teacher</div><input id="file" type="file" accept="image/*" style="margin-top:12px"></div>
 <label for="tg">Flower fund goal ($)</label><input id="tg" type="number" min="10" value="50">
 <label for="tt">Why do they deserve flowers?</label><textarea id="tt" maxlength="600" placeholder="Tell us a moment they made a difference."></textarea>
 <button class="btn big" style="width:100%;margin-top:20px" id="sub">Publish fundraiser</button></div></section>`}};
let pendingImg=null,amount=10;
function route(){const h=(location.hash||'#/').slice(2).split('/');const r=h[0]||'home';const v=r==='donate'?views.donate(h[1]):(views[r]||views.home)();
 $('#app').innerHTML=v;amount=10;pendingImg=null;scrollTo(0,0);
 document.querySelectorAll('[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===(r==='donate'?'teachers':r)));
 if(r==='donate')bindDonate();if(r==='add')bindAdd();sync()}
function bindDonate(){const go=$('#go');const upd=()=>go.textContent='Donate '+money(amount).replace('.00','');
 $('#amts').onclick=e=>{const b=e.target.closest('.amt');if(!b)return;document.querySelectorAll('.amt').forEach(x=>x.classList.remove('on'));b.classList.add('on');amount=+b.dataset.v;$('#cust').value='';upd()};
 $('#cust').oninput=e=>{document.querySelectorAll('.amt').forEach(x=>x.classList.remove('on'));amount=Math.max(0,+e.target.value||0);upd()};
 go.onclick=()=>{const t=S.teachers.find(x=>x.id==go.dataset.id);if(amount<1)return toast('Enter at least $1');
  if($('#pay').value==='bal'){if(amount>S.bal)return toast('Not enough balance. Add funds or pay by card.');S.bal-=amount}
  t.raised+=amount;if(t.mine)S.bal+=amount;
  S.tx.unshift({t:'Donation to '+t.name,a:-amount,d:'Just now'});if(t.mine)S.tx.unshift({t:'Received for '+t.name,a:amount,d:'Just now'});
  sync();toast('Thank you! '+money(amount)+' sent to '+t.name+' 🌷');location.hash='#/teachers'}}
function bindAdd(){$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{pendingImg=r.result;$('#prev').innerHTML=`<img src="${pendingImg}" alt="Preview of uploaded photo">`};r.readAsDataURL(f)};
 $('#sub').onclick=()=>{const n=$('#tn').value.trim(),tx=$('#tt').value.trim();if(!n||!tx)return toast('Add a name and why they deserve flowers');
  const id=Date.now();S.teachers.unshift({id,name:n,role:$('#tr').value.trim()||'Teacher',by:S.user.name,mine:1,goal:Math.max(10,+$('#tg').value||50),raised:0,text:tx,img:pendingImg,av:{bg:'#E6DDF8',skin:'#E3B48F',hair:'#3A2A22',top:'#17352D',style:'short',glasses:0}});
  toast('Fundraiser published!');location.hash='#/donate/'+id}}
const dlg=$('#dlg');
function open(html){dlg.innerHTML=html+'<div style="margin-top:18px"><button class="btn alt sm" id="x">Close</button></div>';dlg.showModal();$('#x').onclick=()=>dlg.close()}
function act(a){$('#menu').classList.remove('open');$('#ab').setAttribute('aria-expanded','false');
 if(a==='fund')open(`<h2>Add funds</h2><p class="small">Demo only, no real card is charged.</p><div class="amts">${[10,25,50,100].map(v=>`<button class="amt" data-f="${v}">$${v}</button>`).join('')}</div>`),dlg.onclick=e=>{const b=e.target.closest('[data-f]');if(b){S.bal+=+b.dataset.f;S.tx.unshift({t:'Added funds',a:+b.dataset.f,d:'Just now'});sync();dlg.close();toast('Added '+money(b.dataset.f))}};
 if(a==='out')open(`<h2>Withdraw</h2><p>Move your balance to your bank so you can buy the flowers.</p><div class="bal">${money(S.bal)}</div><button class="btn" id="wd">Withdraw all</button>`),$('#wd').onclick=()=>{if(S.bal<=0)return toast('Nothing to withdraw');S.tx.unshift({t:'Withdrawal to bank',a:-S.bal,d:'Just now'});S.bal=0;sync();dlg.close();toast('Withdrawal started')};
 if(a==='hist')open(`<h2>Transaction history</h2>${S.tx.map(x=>`<div class="tx"><div>${esc(x.t)}<div class="small">${x.d}</div></div><span class="${x.a>0?'pos':'neg'}">${x.a>0?'+':'−'}${money(Math.abs(x.a))}</span></div>`).join('')}`),dlg.onclick=null;
 if(a==='set')open(`<h2>Account settings</h2><label for="sn">Name</label><input id="sn" value="${esc(S.user.name)}"><label for="se">Email</label><input id="se" type="email" value="${esc(S.user.email)}"><label><input type="checkbox" id="sa" style="width:auto" ${S.user.anon?'checked':''}> Hide my name on donations</label><button class="btn" style="margin-top:14px" id="ss">Save changes</button>`),$('#ss').onclick=()=>{S.user={name:$('#sn').value||'Student',email:$('#se').value,anon:$('#sa').checked};sync();dlg.close();toast('Changes saved')}}
$('#ab').onclick=e=>{e.stopPropagation();const m=$('#menu');m.classList.toggle('open');$('#ab').setAttribute('aria-expanded',m.classList.contains('open'))};
document.addEventListener('click',e=>{if(!e.target.closest('.acct'))$('#menu').classList.remove('open')});
$('#menu').onclick=e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a)};
addEventListener('hashchange',route);route();
</script>
</body>
</html>
